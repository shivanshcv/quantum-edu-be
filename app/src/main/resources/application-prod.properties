# Production — set MYSQL_*, JWT_SECRET, APP_CORS_ORIGINS, etc. via deploy.prod.env / container env.
# TODO: Replace JDBC hostname placeholders below via env only in real deploys (deploy.prod.env).
server.port=${PORT:8080}
# RDS MySQL: useSSL=true required for typical AWS RDS. TODO: If you use VERIFY_IDENTITY + RDS CA bundle,
# add parameters per https://docs.aws.amazon.com/AmazonRDS/latest/UserGuide/MySQL.Concepts.SSLSupport.html
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:TODO_REPLACE_MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:TODO_REPLACE_DB}?serverTimezone=%2B05:30&useSSL=true
spring.datasource.username=${MYSQL_USER:TODO_REPLACE_USER}
spring.datasource.password=${MYSQL_PASSWORD:TODO_REPLACE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-init-sql=SET time_zone = '+05:30'

spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Kolkata
spring.jpa.properties.hibernate.format_sql=false

app.email.enabled=true
app.jwt.secret=${JWT_SECRET:TODO_REPLACE_JWT_SECRET}
# Never enable in production except for a controlled break-glass (see JwtAuthFilter).
app.jwt.dev-bypass=${JWT_DEV_BYPASS:false}

# CORS: set APP_CORS_ORIGINS (Amplify + custom domain). Fallback is a non-routable placeholder — must override in prod.
app.cors.allowed-origins=${APP_CORS_ORIGINS:https://TODO_REPLACE_PRODUCTION_FRONTEND_ORIGIN}

# Currency (INR for India; override via APP_CURRENCY, APP_CURRENCY_SYMBOL env vars)
app.currency.code=${APP_CURRENCY:INR}
app.currency.symbol=${APP_CURRENCY_SYMBOL:\u20B9}
app.email.from=${EMAIL_FROM:TODO_REPLACE_NOREPLY_EMAIL}
app.email.verification-base-url=${VERIFICATION_BASE_URL:https://TODO_REPLACE_PRODUCTION_FRONTEND_ORIGIN/verify-email}

spring.mail.host=${MAIL_HOST:TODO_REPLACE_SMTP_HOST}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:TODO_REPLACE_SMTP_USER}
spring.mail.password=${MAIL_PASSWORD:TODO_REPLACE_SMTP_PASSWORD}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Razorpay LIVE — must be set via env in production (see deploy.prod.env). No test defaults.
razorpay.key_id=${RAZORPAY_KEY_ID:TODO_REPLACE_RAZORPAY_LIVE_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:TODO_REPLACE_RAZORPAY_LIVE_KEY_SECRET}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:TODO_REPLACE_RAZORPAY_WEBHOOK_SECRET}

