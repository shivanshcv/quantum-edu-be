# Render Blueprint: backend API + Django admin on Render's free plan.
# Database: Aiven free MySQL (load it first with ./deploy/render/init-db.sh). Media: Cloudflare R2.
#
# Render dashboard -> New -> Blueprint -> pick this repo. Values marked `sync: false` are asked for
# once during creation; `generateValue` ones are random secrets Render creates for you.
# Free web services sleep after 15 min without traffic; the first request afterwards takes ~1-2 min.

services:
  - type: web
    name: quantum-edu-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Fits the free plan's 512 MB (uses ~300 MB).
      - key: JAVA_TOOL_OPTIONS
        value: -Xmx256m -Xss512k -XX:MaxMetaspaceSize=160m -XX:ReservedCodeCacheSize=64m -XX:+UseSerialGC -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
      - key: TZ
        value: Asia/Kolkata
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: quantum_education
      - key: JWT_SECRET
        generateValue: true
      # Vercel URL, e.g. https://quantum-edu.vercel.app (comma-separate extra origins).
      - key: APP_CORS_ORIGINS
        sync: false
      # <Vercel URL>/verify-email
      - key: VERIFICATION_BASE_URL
        sync: false
      # Brevo SMTP on 2525 (Render free blocks 25/465/587).
      - key: APP_EMAIL_ENABLED
        value: "true"
      - key: MAIL_HOST
        value: smtp-relay.brevo.com
      - key: MAIL_PORT
        value: "2525"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  - type: web
    name: quantum-edu-admin
    runtime: docker
    # Change if your admin repo lives elsewhere.
    repo: https://github.com/shivanshcv/quantum-edu-admin
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: quantum_admin.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: "2"
      - key: TZ
        value: Asia/Kolkata
      - key: MYSQL_HOST
        sync: false
      - key: MYSQL_PORT
        sync: false
      - key: MYSQL_USER
        value: avnadmin
      - key: MYSQL_PASSWORD
        sync: false
      - key: MYSQL_DATABASE
        value: quantum_education
      - key: MYSQL_ADMIN_DB
        value: admin_django
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: DEMO_VIEWER_USERNAME
        value: viewer
      - key: DEMO_VIEWER_PASSWORD
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        sync: false
      - key: R2_PUBLIC_URL
        sync: false
